<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Strathmore Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-[#002147] text-white flex flex-col p-6">
    <h1 class="text-2xl font-bold mb-8">Strathmore</h1>
    <nav class="space-y-4">
      <a href="#" class="block py-2 px-4 rounded-lg hover:bg-[#f2b800] hover:text-black">Dashboard</a>
      <a href="#" class="block py-2 px-4 rounded-lg hover:bg-[#f2b800] hover:text-black">Students</a>
      <a href="#" class="block py-2 px-4 rounded-lg hover:bg-[#f2b800] hover:text-black">Courses</a>
      <a href="#" class="block py-2 px-4 rounded-lg hover:bg-[#f2b800] hover:text-black">Reports</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8">
    <h2 class="text-3xl font-semibold text-[#002147] mb-6">Dashboard Overview</h2>

    <!-- Cards Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-gray-500">Students</h3>
        <p class="text-3xl font-bold text-[#002147]">1,245</p>
      </div>
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-gray-500">Courses</h3>
        <p class="text-3xl font-bold text-[#002147]">82</p>
      </div>
      <div class="bg-white shadow rounded-xl p-6">
        <h3 class="text-gray-500">Reports</h3>
        <p class="text-3xl font-bold text-[#002147]">56</p>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white shadow rounded-xl p-6">
      <h3 class="text-xl font-semibold mb-4 text-[#002147]">Recent Reports</h3>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-100 text-gray-600">
            <th class="py-2 px-4">ID</th>
            <th class="py-2 px-4">Title</th>
            <th class="py-2 px-4">Date</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b">
            <td class="py-2 px-4">01</td>
            <td class="py-2 px-4">Library Audit</td>
            <td class="py-2 px-4">Sept 20, 2025</td>
          </tr>
          <tr class="border-b">
            <td class="py-2 px-4">02</td>
            <td class="py-2 px-4">Student Enrollment</td>
            <td class="py-2 px-4">Sept 18, 2025</td>
          </tr>
          <tr>
            <td class="py-2 px-4">03</td>
            <td class="py-2 px-4">Course Updates</td>
            <td class="py-2 px-4">Sept 15, 2025</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
